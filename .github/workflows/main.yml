name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' TomatoBar.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build (ad-hoc signed, not notarized)
        run: |
          xcodebuild build \
            -project TomatoBar.xcodeproj \
            -scheme TomatoBar \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO
          ditto -c -k --keepParent build/Build/Products/Release/Timeboxer.app "Timeboxer-v${VERSION}.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Timeboxer v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Timeboxer-v${{ env.VERSION }}.zip
